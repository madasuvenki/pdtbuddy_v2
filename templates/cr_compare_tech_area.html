<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Target Delta Studio - Full Page</title>
  <script src="/static/js/chart.umd.min.js"></script>
  <script src="/static/js/chartjs-plugin-datalabels.min.js"></script>
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--line:#dbe3ef;--brand:#2563eb;--brand2:#7c3aed;--bg:#eef3fb;}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8fbff,#eef3ff 48%,#f8f7ff);min-height:100vh}
    header{padding:22px 26px;background:linear-gradient(135deg,#08111f,#102a68 50%,#5521a8);color:#fff;box-shadow:0 18px 50px rgba(30,58,138,.28)}
    h1{margin:0;font-size:28px;letter-spacing:-.04em}.sub{margin-top:8px;color:#dbeafe;font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
    button,select{border:0;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}button{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 10px 20px rgba(37,99,235,.25)}select{background:#fff;color:#0f172a;border:1px solid #cbd5e1}.ghost{background:#f8fafc;color:#1e293b;border:1px solid #cbd5e1;box-shadow:none}.muted{color:var(--muted);font-size:12px}.wrap{padding:18px 20px}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(203,213,225,.85);border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.12);margin-bottom:18px;overflow:hidden}.panel-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;background:linear-gradient(90deg,#f8fafc,#eef4ff)}.panel-h h2{font-size:16px;margin:0}.panel-b{padding:16px 18px}.chartbox{height:440px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;padding:12px}.err{color:#991b1b;background:#fee2e2;border:1px solid #fecaca;padding:12px;border-radius:14px;font-weight:800}.hidden{display:none!important}
    .crd-wrap{overflow:auto;border-radius:18px;box-shadow:0 8px 28px rgba(15,23,42,.09);border:1px solid rgba(203,213,225,.7);max-height:calc(100vh - 250px)}.crd-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}.crd-table th{padding:11px 16px;text-align:left;font-size:11px;font-weight:900;color:#1e2f55;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #dbe8f8;white-space:nowrap;position:sticky;top:0;z-index:2;background:#eef4ff}.crd-table th.area-col{min-width:190px;position:sticky;left:0;z-index:3}.crd-table td{padding:10px 16px;border-bottom:1px solid #f1f5f9;vertical-align:top}.crd-table td.area-cell{position:sticky;left:0;background:#fafcff;font-weight:900;color:#1e2f55;border-right:2px solid #e8eef8;z-index:1;white-space:nowrap}.crd-table tr:hover td{background:#f4f8ff}.crd-table tr:hover td.area-cell{background:#eaf1ff}.crd-total{font-size:14px;font-weight:900;color:#1e2f55;margin-bottom:5px;display:flex;align-items:baseline;gap:5px}.crd-occ{color:#7c3aed;font-size:11px;font-weight:700}.crd-status-pills{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px}.crd-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;border:1px solid}.crd-bar-wrap{height:3px;background:#eef2f8;border-radius:3px;overflow:hidden;margin-top:4px}.crd-bar{height:100%;border-radius:3px}.crd-delta-pos{color:#dc2626;font-weight:900}.crd-delta-neg{color:#16a34a;font-weight:900}.crd-delta-zero{color:#94a3b8}.crd-entity-td{min-width:230px}.copyBtn{float:right;margin-bottom:10px}.siDetails{min-width:110px;max-width:280px}.siDetails summary{cursor:pointer;color:#1d4ed8;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.siDetails div{margin-top:6px;padding:7px 9px;border:1px solid #dbeafe;border-radius:10px;background:#f8fbff;color:#334155;font-size:11px;line-height:1.45;white-space:normal;word-break:break-word}.imageFilterGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.imageFilterBox{border:1px solid #dbe3ef;border-radius:14px;background:linear-gradient(180deg,#fff,#f8fbff);padding:10px}.imageFilterBox summary{cursor:pointer;font-size:11px;font-weight:900;color:#1e3a8a;text-transform:uppercase;letter-spacing:.04em}.imageCheckWrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;max-height:150px;overflow:auto}.imageCheck{display:inline-flex;align-items:center;gap:5px;border:1px solid #dbe3ef;border-radius:999px;padding:5px 8px;background:#f8fafc;font-size:10px;font-weight:800;color:#334155}.imageCheck input{width:13px;height:13px;accent-color:#2563eb}.loading{opacity:.6;pointer-events:none}
    .collapsible-table{clear:both;margin:12px 0 20px;border:1px solid rgba(203,213,225,.85);border-radius:20px;background:linear-gradient(180deg,#fff,#f8fbff);box-shadow:0 16px 38px rgba(37,99,235,.10);overflow:hidden;transition:.18s transform,.18s box-shadow,.18s border-color}.collapsible-table:hover{transform:translateY(-1px);box-shadow:0 22px 50px rgba(37,99,235,.14);border-color:#b8c7e3}.collapsible-table summary{cursor:pointer;list-style:none;padding:15px 18px;font-size:12px;font-weight:950;color:#13264a;background:linear-gradient(135deg,#f8fafc,#eef4ff);border-bottom:1px solid transparent;display:flex;align-items:center;gap:10px;letter-spacing:.01em}.collapsible-table summary::-webkit-details-marker{display:none}.collapsible-table summary:before{content:'+';display:inline-grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:15px;font-weight:950;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}.collapsible-table summary:after{content:'Click to expand';margin-left:auto;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);color:#475569;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.collapsible-table[open] summary{border-bottom-color:#dbe3ef}.collapsible-table[open] summary:before{content:'–';background:#e2e8f0;color:#334155}.collapsible-table[open] summary:after{content:'Expanded';background:#dcfce7;color:#15803d;border-color:#bbf7d0}.collapsible-table .crd-wrap{border:0;border-radius:0;box-shadow:none;margin-bottom:0!important}.collapsible-table:nth-of-type(5n+1) summary{background:linear-gradient(135deg,#eff6ff,#e0e7ff);color:#1e3a8a}.collapsible-table:nth-of-type(5n+1){border-color:#bfdbfe}.collapsible-table:nth-of-type(5n+2) summary{background:linear-gradient(135deg,#f5f3ff,#ede9fe);color:#5b21b6}.collapsible-table:nth-of-type(5n+2){border-color:#ddd6fe}.collapsible-table:nth-of-type(5n+3) summary{background:linear-gradient(135deg,#ecfeff,#cffafe);color:#155e75}.collapsible-table:nth-of-type(5n+3){border-color:#a5f3fc}.collapsible-table:nth-of-type(5n+4) summary{background:linear-gradient(135deg,#fff7ed,#ffedd5);color:#9a3412}.collapsible-table:nth-of-type(5n+4){border-color:#fed7aa}.collapsible-table:nth-of-type(5n+5) summary{background:linear-gradient(135deg,#ecfdf5,#dcfce7);color:#166534}.collapsible-table:nth-of-type(5n+5){border-color:#bbf7d0}#completeDetailsContainer h3{margin:22px 0 12px;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,#eff6ff,#f5f3ff 60%,#ecfeff);border:1px solid #bfdbfe;color:#1e3a8a;font-size:13px;font-weight:950;letter-spacing:.02em;box-shadow:0 14px 30px rgba(37,99,235,.12)}#completeDetailsContainer h4{margin:14px 0 8px;padding:9px 12px;border-radius:13px;background:linear-gradient(135deg,#ffffff,#f1f5ff);border:1px solid #dbeafe;color:#1e2f55;font-size:12px;font-weight:950;box-shadow:0 8px 18px rgba(37,99,235,.08)}
    /* Light premium theme overrides: soft colors only, no dark headers/buttons */
    header{background:linear-gradient(135deg,#ffffff 0%,#eff6ff 42%,#f5f3ff 76%,#ecfeff 100%)!important;color:#1e2f55!important;border-bottom:1px solid #bfdbfe!important;box-shadow:0 18px 50px rgba(37,99,235,.16)!important}h1{color:#1e3a8a!important}.sub{color:#475569!important}button{background:linear-gradient(135deg,#3b82f6,#7c3aed 58%,#06b6d4)!important;color:#ffffff!important;border:1px solid rgba(99,102,241,.45)!important;box-shadow:0 14px 28px rgba(59,130,246,.26)!important}button:hover{filter:saturate(1.08) brightness(1.03);box-shadow:0 18px 34px rgba(124,58,237,.28)!important}.ghost{background:linear-gradient(135deg,#f8fafc,#e0f2fe)!important;color:#1e3a8a!important;border-color:#bfdbfe!important;box-shadow:0 8px 18px rgba(37,99,235,.10)!important}.panel-h{background:linear-gradient(90deg,#ffffff,#eff6ff,#f5f3ff)!important}.panel-h h2{display:inline-flex!important;align-items:center;gap:10px;color:#4f46e5!important;font-size:17px!important;font-weight:1000!important;letter-spacing:.01em!important}.panel-h h2:before{content:"";width:6px;height:22px;border-radius:999px;background:linear-gradient(180deg,#3b82f6,#7c3aed,#06b6d4);box-shadow:0 8px 18px rgba(79,70,229,.26)}.collapsible-table summary{font-weight:1000!important;color:#4f46e5!important}
  </style>
</head>
<body>
<header>
  <h1>Target Delta Studio - Full Page</h1>
  <div class="sub" id="pageMeta">Loading target delta...</div>
  <div class="toolbar">
    <label class="muted">Dimension</label>
    <select id="dimSelect" onchange="renderFullPage()"><option value="area_comparison">CR Area</option><option value="subsystem_comparison">CR Subsystem</option><option value="functionality_comparison">CR Functionality</option></select>
    <label class="muted">Regression</label>
    <select id="regSelect" onchange="renderFullPage()"><option value="all">All</option><option value="yes">Regression = Yes</option><option value="no">Regression = No</option></select>
    <button onclick="copyTableImage(this)">Copy Table Image</button>
    <button onclick="copyChartImage(this)">Copy Chart Image</button>
    <button class="ghost" onclick="window.close()">Close</button>
  </div>
</header>
<div class="wrap">
  <div id="errorBox" class="err hidden"></div>
  <section class="panel">
    <div class="panel-h"><h2>CR Image Filters</h2><span class="muted" id="imageFilterMsg">Select required images, then apply.</span></div>
    <div class="panel-b" id="imageFilterContainer"></div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2 id="chartTitle">Chart</h2><span class="muted" id="chartMeta"></span></div>
    <div class="panel-b"><div class="chartbox"><canvas id="areaBarChart"></canvas></div></div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2 id="tableTitle">Table</h2><span class="muted">Wide full-page view for sharing/copying</span></div>
    <div class="panel-b" id="areaTableContainer"></div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2>Complete Target Delta Details</h2><span class="muted">Includes image/SI values from unique_crs.image</span></div>
    <div class="panel-b" id="completeDetailsContainer"></div>
  </section>
</div>
<script>
const STATUS_COLORS={open:{bg:'#dbeafe',color:'#1d4ed8',border:'#93c5fd'},analysis:{bg:'#ede9fe',color:'#6d28d9',border:'#c4b5fd'},built:{bg:'#dcfce7',color:'#15803d',border:'#86efac'},fix:{bg:'#d1fae5',color:'#065f46',border:'#6ee7b7'},ready:{bg:'#ecfdf5',color:'#047857',border:'#a7f3d0'},closed:{bg:'#f1f5f9',color:'#475569',border:'#cbd5e1'},withdrawn:{bg:'#fef3c7',color:'#92400e',border:'#fcd34d'},cannotduplicate:{bg:'#fef9c3',color:'#713f12',border:'#fde047'},nosir:{bg:'#fff7ed',color:'#c2410c',border:'#fdba74'},notapplicable:{bg:'#f8fafc',color:'#64748b',border:'#e2e8f0'},obsolete:{bg:'#fdf4ff',color:'#7e22ce',border:'#e9d5ff'},postponed:{bg:'#fff1f2',color:'#be123c',border:'#fecdd3'},invalid:{bg:'#fee2e2',color:'#b91c1c',border:'#fca5a5'},dup:{bg:'#fef3c7',color:'#92400e',border:'#fcd34d'}};
const colors=['#6366f1','#06b6d4','#f59e0b','#ef4444','#8b5cf6','#10b981','#f97316','#ec4899'];const colorsDark=['#4338ca','#0e7490','#b45309','#b91c1c','#6d28d9','#047857','#c2410c','#be185d'];
let RESULT=null,_areaChart=null;
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function num(v){return Number(v||0).toLocaleString();}
function siCell(value){const text=String(value||'').trim();if(!text)return '<span style="color:#94a3b8;">—</span>';return `<details class="siDetails"><summary>Show SI/Image</summary><div>${esc(text)}</div></details>`;}
function hasChart(){return typeof window.Chart!=='undefined';}
if(hasChart()&&window.ChartDataLabels){Chart.register(ChartDataLabels);}const chartPluginOpts={legend:{position:'bottom'},datalabels:{anchor:'end',align:'top',offset:2,clip:false,color:'#0f172a',font:{weight:'800',size:10},formatter:v=>v?Number(v).toLocaleString():''}};
function premiumDataset(label,i,data){return{label,data,backgroundColor:colors[i%colors.length]+'cc',borderColor:colorsDark[i%colorsDark.length],borderWidth:1.5,borderRadius:6,borderSkipped:false};}
function showErr(t){const e=document.getElementById('errorBox');e.textContent=t||'';e.classList.toggle('hidden',!t)}
function loadResult(){const key=new URLSearchParams(location.search).get('key');if(!key)throw new Error('Missing target delta key. Open this page from Target Delta Studio.');if(window.opener&&window.opener.__CR_COMPARE_TRANSFER__&&window.opener.__CR_COMPARE_TRANSFER__[key]){return window.opener.__CR_COMPARE_TRANSFER__[key];}const raw=sessionStorage.getItem(key)||localStorage.getItem(key);if(!raw)throw new Error('Target delta data expired. Reopen from Target Delta Studio.');return JSON.parse(raw);}
function renderImageFilters(){const box=document.getElementById('imageFilterContainer');if(!box||!RESULT)return;const entities=RESULT.entities||[];const parts=entities.map((e,i)=>{const opts=e.image_options||[];if(!opts.length)return '';const active=!!e.image_filter_active;const selected=new Set((e.images||[]).map(x=>String(x).toLowerCase()));const checks=opts.map(img=>`<label class="imageCheck"><input type="checkbox" class="imageFilterCheck" data-entity-index="${i}" value="${esc(img)}" ${(!active||selected.has(String(img).toLowerCase()))?'checked':''} onchange="document.getElementById('imageFilterMsg').textContent='Image selection changed. Click Apply Image Filters.'"> ${esc(img)}</label>`).join('');const txt=active?`${(e.images||[]).length} selected`:'All images';return `<details class="imageFilterBox" open><summary>${esc(e.label)} · ${esc(txt)}</summary><div class="imageCheckWrap">${checks}</div></details>`;}).filter(Boolean).join('');box.innerHTML=parts?`<div class="imageFilterGrid">${parts}</div><div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button onclick="applyImageFilters()">Apply Image Filters</button><button class="ghost" onclick="selectAllImageFilters(true)">Select All</button><button class="ghost" onclick="selectAllImageFilters(false)">Clear All</button></div>`:'<p class="muted">No image values found for these delta sets.</p>';}
function selectAllImageFilters(checked){document.querySelectorAll('.imageFilterCheck').forEach(cb=>cb.checked=checked);document.getElementById('imageFilterMsg').textContent='Image selection changed. Click Apply Image Filters.';}
async function applyImageFilters(){if(!RESULT)return;document.body.classList.add('loading');showErr('');try{const entities=(RESULT.entities||[]).map((e,i)=>{const all=e.image_options||[];const selected=Array.from(document.querySelectorAll(`.imageFilterCheck[data-entity-index="${i}"]:checked`)).map(cb=>cb.value);return {...e,images:selected,image_filter_active:selected.length!==all.length};});const payload={entities,dimension:RESULT.dimension||'cr_area',status_filter:RESULT.status_filter||'all',cr_statuses:RESULT.cr_statuses||[],date_from:RESULT.date_from||'',date_to:RESULT.date_to||''};const r=await fetch('/api/cr_compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Target delta failed');RESULT=data;const key=new URLSearchParams(location.search).get('key');if(key){if(window.opener){window.opener.__CR_COMPARE_TRANSFER__=window.opener.__CR_COMPARE_TRANSFER__||{};window.opener.__CR_COMPARE_TRANSFER__[key]=RESULT;}else{try{sessionStorage.setItem(key,JSON.stringify(RESULT));}catch(e){}}}document.getElementById('imageFilterMsg').textContent='Applied image filters at '+new Date().toLocaleTimeString();renderFullPage();}catch(e){showErr(e.message||String(e));}finally{document.body.classList.remove('loading');}}
function renderFullPage(){if(!RESULT)return;renderImageFilters();const dim=document.getElementById('dimSelect').value;const regFilter=document.getElementById('regSelect').value;const labels=RESULT.entities.map(e=>e.label);const statusTableMap={area_comparison:'area_status_comparison',subsystem_comparison:'subsystem_status_comparison',functionality_comparison:'functionality_status_comparison'};const dimKeyMap={area_comparison:'area',subsystem_comparison:'subsystem',functionality_comparison:'functionality'};const dimName={area_comparison:'CR Area',subsystem_comparison:'CR Subsystem',functionality_comparison:'CR Functionality'}[dim]||'CR Area';const statusKey=statusTableMap[dim]||'area_status_comparison';const compRows=((RESULT[statusKey]||{})[regFilter])||[];document.getElementById('chartTitle').textContent=dimName+' Chart';document.getElementById('tableTitle').textContent=dimName+' Table';document.getElementById('chartMeta').textContent=compRows.length+' rows';if(!compRows.length){document.getElementById('areaTableContainer').innerHTML='<p class="muted">No data for this filter.</p>';return;}const sorted=[...compRows].sort((a,b)=>(b.total||0)-(a.total||0));if(hasChart()){const canvas=document.getElementById('areaBarChart');if(_areaChart){_areaChart.destroy();_areaChart=null;}const topRows=sorted.slice(0,25);_areaChart=new Chart(canvas,{type:'bar',data:{labels:topRows.map(r=>r.label&&r.label.length>22?r.label.slice(0,20)+'…':r.label),datasets:labels.map((l,i)=>premiumDataset(l,i,topRows.map(r=>Number((((r.entities||{})[l]||{}).count)||0))))},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},plugins:chartPluginOpts,scales:{x:{ticks:{autoSkip:false,maxRotation:40,minRotation:0,font:{size:10}}},y:{beginAtZero:true,grace:'15%'}}}});}const maxTotal={};labels.forEach(l=>{maxTotal[l]=Math.max(...sorted.map(r=>Number(((r.entities||{})[l]||{}).count||0)),1);});const sortedStatuses=['Open','Analysis','Fix','Ready','Built','Withdrawn','CannotDuplicate','NoSIR','NotApplicable','Postponed','Obsolete','Closed'];const dimKey=dimKeyMap[dim]||'area';let html=`<div class="crd-wrap" id="areaTableWrap"><table class="crd-table"><thead><tr><th class="area-col">${esc(dimName)}</th>`;labels.forEach((l,i)=>{html+=`<th style="color:${colors[i%colors.length]};min-width:230px;">${esc(l)}</th>`});html+='<th>Delta</th></tr></thead><tbody>';sorted.forEach(row=>{const area=row.label;html+=`<tr><td class="area-cell">${esc(area)}</td>`;labels.forEach((l,i)=>{const ent=((row.entities||{})[l]||{});const total=Number(ent.count||0);const byStatus=ent.statuses||{};const occ=Number(ent.occurrence||0);const barPct=total?Math.round(total/maxTotal[l]*100):0;const pills=sortedStatuses.filter(s=>byStatus[s]>0).map(s=>{const key=s.toLowerCase().replace(/[^a-z]/g,'');const c=STATUS_COLORS[key]||{bg:'#f1f5f9',color:'#475569',border:'#cbd5e1'};return `<span class="crd-pill" style="background:${c.bg};color:${c.color};border-color:${c.border};">${esc(s)} ${byStatus[s]}</span>`}).join('');html+=`<td class="crd-entity-td"><div class="crd-total">${total?num(total):'<span style="color:#cbd5e1">—</span>'}${occ>0?` <span class="crd-occ">(${num(occ)})</span>`:''}</div><div class="crd-status-pills">${pills||'<span style="color:#cbd5e1;font-size:10px;">—</span>'}</div><div class="crd-bar-wrap"><div class="crd-bar" style="width:${barPct}%;background:${colors[i%colors.length]};"></div></div></td>`});const delta=row.delta!=null?row.delta:(Number((((row.entities||{})[labels[0]]||{}).count)||0)-Number((((row.entities||{})[labels[1]]||{}).count)||0));html+=`<td style="text-align:right;vertical-align:middle;"><span class="${delta>0?'crd-delta-pos':delta<0?'crd-delta-neg':'crd-delta-zero'}">${delta>0?'+':''}${delta!==0?num(delta):'—'}</span></td></tr>`});html+='</tbody></table></div>';document.getElementById('areaTableContainer').innerHTML=collapsibleTable(`Show ${dimName} table (${num(sorted.length)} rows)`,html,false);renderCompleteDetails();}
function collapsibleTable(title, bodyHtml, open){return `<details class="collapsible-table" ${open?'open':''}><summary>${esc(title)}</summary>${bodyHtml}</details>`;}
function detailTable(headers,rows){const rowCount=(String(rows||'').match(/<tr\b/g)||[]).length;const body=`<div class="crd-wrap" style="max-height:520px;margin-bottom:18px"><table class="crd-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`;return collapsibleTable(`Show table (${num(rowCount)} rows)`,body,false);}
function renderCompleteDetails(){if(!RESULT)return;const labels=RESULT.entities.map(e=>e.label);let html='';const reg=RESULT.regression_comparison||{};const perEntity=reg.per_entity||{};html+='<h3>Regression CRs</h3>';labels.forEach(l=>{const rows=perEntity[l]||[];html+=`<h4>${esc(l)} (${num(rows.length)})</h4>`;html+=detailTable(['S.No','CR','Title','Area','Subsystem','Functionality','Image/SI','Status','Age','Occurrence','JIRAs','Targets'],rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.cr)}</td><td>${esc(r.title)}</td><td>${esc(r.area)}</td><td>${esc(r.subsystem)}</td><td>${esc(r.functionality)}</td><td>${siCell(r.image||(r.images||[]).join(', '))}</td><td>${esc(r.status)}</td><td>${esc(r.age)}</td><td>${num(r.occurrence)}</td><td>${num(r.jiras)}</td><td>${esc(r.target_source)}</td></tr>`).join(''));});const common=RESULT.common_crs||[];html+=`<h3>Common CRs (${num(common.length)})</h3>`;html+=detailTable(['S.No','CR','Title','Area','Subsystem','Functionality','Image/SI',...labels.map(l=>l+' Details')],common.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.cr)}</td><td>${esc(r.title)}</td><td>${esc(r.area)}</td><td>${esc(r.subsystem)}</td><td>${esc(r.functionality)}</td><td>${siCell(r.image||(r.images||[]).join(', '))}</td>${labels.map(l=>{const e=(r.entities||{})[l]||{};return `<td>Status: ${esc(e.status)}<br>Age: ${esc(e.age)}d · Occ: ${num(e.occurrence)} · JIRAs: ${num(e.jiras)}<br>Targets: ${esc((e.targets||[]).join(', '))}<br>Image/SI: ${siCell(e.image||(e.images||[]).join(', '))}</td>`}).join('')}</tr>`).join(''));html+='<h3>Exclusive CRs</h3>';labels.forEach(l=>{const rows=(RESULT.exclusive_crs||{})[l]||[];html+=`<h4>${esc(l)} exclusive (${num(rows.length)})</h4>`;html+=detailTable(['S.No','CR','Title','Area','Subsystem','Functionality','Image/SI','Status','Age','Occurrence','JIRAs','Targets'],rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.cr)}</td><td>${esc(r.title)}</td><td>${esc(r.area)}</td><td>${esc(r.subsystem)}</td><td>${esc(r.functionality)}</td><td>${siCell(r.image||(r.images||[]).join(', '))}</td><td>${esc(r.status)}</td><td>${esc(r.age)}</td><td>${num(r.occurrence)}</td><td>${num(r.jiras)}</td><td>${esc(r.target_source)}</td></tr>`).join(''));});const sites=RESULT.site_comparison||[];html+=`<h3>Sites</h3>`;html+=detailTable(['S.No','Site',...labels],sites.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.site_label)}</td>${labels.map(l=>`<td>${num((r.entities||{})[l]||0)}</td>`).join('')}</tr>`).join(''));document.getElementById('completeDetailsContainer').innerHTML=html;}
let _html2CanvasLoading=null;
async function ensureHtml2Canvas(){
  if(typeof html2canvas!=='undefined')return;
  if(_html2CanvasLoading)return _html2CanvasLoading;
  _html2CanvasLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=res;s.onerror=()=>rej(new Error('Unable to load image capture library.'));document.head.appendChild(s);});
  return _html2CanvasLoading;
}
function setCopyState(btn,text){if(btn)btn.textContent=text;}
function downloadCanvas(canvas,fileName){const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=fileName||'target_delta_capture.png';document.body.appendChild(a);a.click();a.remove();}
function legacyCopyCanvas(canvas){
  return new Promise(resolve=>{
    const img=document.createElement('img');img.src=canvas.toDataURL('image/png');
    img.onload=()=>{
      const div=document.createElement('div');
      div.contentEditable='true';
      div.style.cssText='position:fixed;top:0;left:-100000px;opacity:.01;background:#fff;z-index:-1;';
      div.appendChild(img);document.body.appendChild(div);
      const range=document.createRange();range.selectNodeContents(div);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
      let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
      sel.removeAllRanges();document.body.removeChild(div);resolve(ok);
    };
    img.onerror=()=>resolve(false);
  });
}
async function copyImageToClipboard(canvas,btn,oldText,fileName){
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(blob&&navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    setCopyState(btn,'Copied!');setTimeout(()=>setCopyState(btn,oldText),1400);return;
  }
  const legacyOk=await legacyCopyCanvas(canvas);
  if(legacyOk){setCopyState(btn,'Copied!');setTimeout(()=>setCopyState(btn,oldText),1400);return;}
  downloadCanvas(canvas,fileName);
  setCopyState(btn,'Downloaded');setTimeout(()=>setCopyState(btn,oldText),1800);
}
function temporarilyExpandForCapture(root){
  const changes=[];
  root.querySelectorAll('details.collapsible-table').forEach(d=>{changes.push([d,'open',d.open]);d.open=true;});
  root.querySelectorAll('.crd-wrap').forEach(w=>{changes.push([w,'style',w.getAttribute('style')]);w.style.maxHeight='none';w.style.overflow='visible';});
  return ()=>changes.reverse().forEach(([el,type,val])=>{if(type==='open')el.open=val;else if(val==null)el.removeAttribute('style');else el.setAttribute('style',val);});
}
async function copyTableImage(btn){
  const old=btn?btn.textContent:'Copy Table Image';
  let restore=null;
  try{
    setCopyState(btn,'Capturing...');showErr('');await ensureHtml2Canvas();
    const el=document.getElementById('areaTableContainer');if(!el)throw new Error('Table is not available yet.');
    restore=temporarilyExpandForCapture(el);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const canvas=await html2canvas(el,{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#fff',scrollX:-window.scrollX,scrollY:-window.scrollY,windowWidth:document.documentElement.scrollWidth,windowHeight:document.documentElement.scrollHeight,logging:false});
    if(restore){restore();restore=null;}
    await copyImageToClipboard(canvas,btn,old,'target_delta_table.png');
  }catch(e){setCopyState(btn,old);showErr(e.message||String(e));}
  finally{if(restore)restore();}
}
async function copyChartImage(btn){
  const old=btn?btn.textContent:'Copy Chart Image';
  try{
    setCopyState(btn,'Capturing...');showErr('');await ensureHtml2Canvas();
    const canvasEl=document.getElementById('areaBarChart');const el=canvasEl?canvasEl.parentElement:null;if(!el)throw new Error('Chart is not available yet.');
    const canvas=await html2canvas(el,{scale:3,useCORS:true,allowTaint:true,backgroundColor:'#fff',scrollX:-window.scrollX,scrollY:-window.scrollY,logging:false});
    await copyImageToClipboard(canvas,btn,old,'target_delta_chart.png');
  }catch(e){setCopyState(btn,old);showErr(e.message||String(e));}
}
try{RESULT=loadResult();document.getElementById('pageMeta').textContent=(RESULT.entities||[]).map(e=>e.label).join(' vs ')+' · Generated '+new Date((RESULT.generated_at||Date.now()/1000)*1000).toLocaleString();const params=new URLSearchParams(location.search);if(params.get('dim'))document.getElementById('dimSelect').value=params.get('dim');if(params.get('reg'))document.getElementById('regSelect').value=params.get('reg');renderFullPage();}catch(e){showErr(e.message||String(e));}
</script>
