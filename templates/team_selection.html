<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Team Access</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --border: #e4e7ec;
      --shadow: 0 24px 70px rgba(20, 34, 70, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79,70,229,.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(16,185,129,.15), transparent 34%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 34px;
    }
    .header { text-align: center; margin-bottom: 28px; }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 14px 30px rgba(79,70,229,.25);
      font-size: 26px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    p { margin: 10px 0 0; color: var(--muted); line-height: 1.55; }
    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }
    .option {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 22px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      min-height: 170px;
    }
    .option:hover {
      transform: translateY(-3px);
      border-color: rgba(79,70,229,.5);
      box-shadow: 0 16px 36px rgba(20, 34, 70, .12);
    }
    .option .badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      font-size: 20px;
    }
    .internal .badge { background: rgba(79,70,229,.12); color: var(--primary); }
    .external .badge { background: rgba(16,185,129,.12); color: #059669; }
    .option h2 { margin: 0 0 8px; font-size: 20px; }
    .option span { color: var(--muted); line-height: 1.5; font-size: 14px; display: block; }
    .footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 680px) {
      .card { padding: 24px; }
      .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="header">
      <div class="icon"><i class="fa-solid fa-users-gear"></i></div>
      <h1>Select your PDT access</h1>
      <p>You are part of {{ target_group }}. Please choose where you want to continue.</p>
    </div>

    <form method="post" class="options">
      <button class="option internal" type="submit" name="team_type" value="internal">
        <span class="badge"><i class="fa-solid fa-chart-line"></i></span>
        <h2>Internal Team</h2>
        <span>Open the internal PDT Buddy dashboard with full internal tools and QGenie access.</span>
      </button>

      <button class="option external" type="submit" name="team_type" value="external">
        <span class="badge"><i class="fa-solid fa-display"></i></span>
        <h2>External Team</h2>
        <span>Open the published Live Status page at /pdt/live_status.</span>
      </button>
    </form>

    <div class="footer">
      Choose Internal only if you need PDT Buddy internal dashboard access.
    </div>
  </main>
</body>
</html>
