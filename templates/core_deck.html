<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Core Deck Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#e5e7eb;font-family:Arial,Helvetica,sans-serif;color:#111827}.page{padding:22px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.title{font-size:24px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer}.btn-primary{background:#ef1747;color:#fff}.btn-dark{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:#fff;border:1px solid #d1d5db;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}.panel-h{padding:14px 16px;background:#111827;color:#fff;font-weight:900}.panel-b{padding:16px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:900;color:#4b5563;margin-bottom:6px;text-transform:uppercase}select,input,textarea{width:100%;border:1.5px solid #d1d5db;border-radius:10px;padding:10px;font-weight:700;background:#fff}.meta-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}.meta-card{border:1.5px solid #e5e7eb;border-radius:12px;padding:10px;background:#fafafa}.meta-row{display:flex;gap:8px;align-items:flex-start}.meta-row input[type=checkbox]{width:auto;margin-top:3px}.meta-id{font-weight:900;color:#111827}.meta-sub{font-size:11px;color:#6b7280;margin-top:3px}.alias{margin-top:8px}.slide{width:1180px;min-height:665px;background:#fff;margin:0 auto;border:1px solid #cbd5e1;box-shadow:0 14px 40px rgba(0,0,0,.18);position:relative;overflow:hidden}.slide-head{display:flex;height:74px;border-bottom:3px solid #111827}.slide-title{flex:1;padding:15px 24px;font-size:28px;font-weight:900}.qmark{width:84px;background:#ef1747;color:#fff;font-size:62px;font-weight:900;text-align:center;line-height:74px}.slide-body{padding:18px 24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.card{border:1px solid #cbd5e1;background:#f8fafc;padding:10px;border-radius:8px}.card .n{font-size:24px;font-weight:900;color:#ef1747}.card .l{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase}.section-title{font-size:16px;font-weight:900;margin:12px 0 8px;color:#111827;border-left:5px solid #ef1747;padding-left:8px}.slide-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:14px}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th{background:#111827;color:#fff;text-align:left;padding:7px}.data-table td{border:1px solid #d1d5db;padding:6px;vertical-align:top}.data-table tr:nth-child(even) td{background:#f8fafc}.small{font-size:11px;color:#64748b}.chart-wrap{height:230px;border:1px solid #d1d5db;border-radius:10px;padding:8px}.exec ul{margin:4px 0 0 20px;padding:0}.exec li{margin:4px 0;font-size:13px}.muted{color:#64748b}.status{font-size:12px;font-weight:800;margin-top:8px;color:#475569}.pill{display:inline-block;border-radius:999px;background:#fee2e2;color:#991b1b;padding:3px 8px;font-size:10px;font-weight:900;margin:2px}.hidden{display:none}
  </style>
</head>
<body {% if embedded %}style="background:#fff;"{% endif %}>
<div class="page" {% if embedded %}style="padding:0;"{% endif %}>
  <div class="top" {% if embedded %}style="display:none;"{% endif %}>
    <div><div class="title"><i class="fas fa-file-powerpoint" style="color:#ef1747"></i> Core Deck Preview</div><div class="small">Phase 1–3: select BU/Target/Meta and render slide-style preview. No PPT export.</div></div>
    <a class="btn btn-dark" href="{{ url_for('live_status_publish_bp.landing') }}" style="text-decoration:none">Back to Live Status</a>
  </div>
  <div class="grid">
    <div class="panel">
      <div class="panel-h">Deck Inputs</div>
      <div class="panel-b">
        <div class="field"><label>Business Unit</label><select id="buSelect"><option value="">Select BU</option>{% for bu in bu_rows %}<option value="{{ bu.bu_key }}">{{ bu.bu_name }}</option>{% endfor %}</select></div>
        <div class="field"><label>Target</label><select id="targetSelect"><option value="">Select Target</option></select></div>
        <div class="field"><label>Meta dropdown</label><select id="metaDropdown"><option value="">Latest metas load after target</option></select></div>
        <div class="field"><label>Latest 4–5 Meta builds</label><div id="metaList" class="meta-list"><div class="small">Choose target to load metas.</div></div><div id="metaStatus" class="status"></div></div>
        <div class="field"><label>Exec Summary bullets</label><textarea id="execSummary" rows="5" placeholder="One bullet per line. Optional for now."></textarea></div>
        <button class="btn btn-primary" onclick="buildPreview()"><i class="fas fa-eye"></i> Preview Deck</button>
        <button class="btn btn-dark" onclick="saveCurrent()" style="margin-top:8px;width:100%;"><i class="fas fa-save"></i> Save Core Deck JSON</button>
        <button class="btn" onclick="refreshCrashes()" style="margin-top:8px;width:100%;background:#2563eb;color:#fff;"><i class="fas fa-sync"></i> Refresh Crashes Only</button>
        <div id="saveStatus" class="status"></div>
        <div class="field" style="margin-top:14px;"><label>Revision History</label><select id="revisionSelect"><option value="">No revisions loaded</option></select><button class="btn" onclick="revertRevision()" style="margin-top:8px;width:100%;background:#f59e0b;color:#111827;"><i class="fas fa-undo"></i> Revert Selected Revision</button></div>
      </div>
    </div>
    <div>
      <div id="preview" class="slide">
        <div class="slide-head"><div class="slide-title">Core Deck Preview</div><div class="qmark">+</div></div>
        <div class="slide-body"><p class="muted">Select BU, target, meta rows and click Preview Deck.</p></div>
      </div>
    </div>
  </div>
</div>
<script>
const TARGET_OPTIONS = {{ target_options|tojson }};
const PRESELECTED_TARGET = {{ preselected_target|default('')|tojson }};
const buSelect=document.getElementById('buSelect'), targetSelect=document.getElementById('targetSelect'), metaList=document.getElementById('metaList'), metaDropdown=document.getElementById('metaDropdown');
let currentMetas=[];
let currentPreview=null;
let currentSavedState=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function buildTargets(){const bu=buSelect.value;targetSelect.innerHTML='<option value="">Select Target</option>';TARGET_OPTIONS.filter(r=>String(r.bu_key).toUpperCase()===bu).forEach(r=>{const o=document.createElement('option');o.value=r.target;o.textContent=r.target;targetSelect.appendChild(o);});metaList.innerHTML='<div class="small">Choose target to load metas.</div>';metaDropdown.innerHTML='<option value="">Latest metas load after target</option>';currentMetas=[];}
buSelect.addEventListener('change', buildTargets);
targetSelect.addEventListener('change', loadMetas);
async function loadMetas(){const target=targetSelect.value;if(!target)return;currentPreview=null;currentSavedState=null;metaList.innerHTML='<div class="small">Loading metas...</div>';metaDropdown.innerHTML='<option value="">Loading...</option>';const r=await fetch('/api/core_deck/metas?target='+encodeURIComponent(target)+'&limit=5');const d=await r.json();if(!d.ok){metaList.innerHTML='<div class="small">'+esc(d.error||'failed')+'</div>';return;}currentSavedState=d.saved_state||null;const savedMetas=(currentSavedState&&currentSavedState.selected_metas)||[];const latest=d.metas||[];const byId={};savedMetas.forEach(m=>{byId[m.meta_id]=Object.assign({saved:true},m);});latest.forEach(m=>{byId[m.meta_id]=Object.assign({},m,byId[m.meta_id]||{});});currentMetas=Object.values(byId);metaDropdown.innerHTML='<option value="">Select Meta</option>'+currentMetas.map(m=>'<option value="'+esc(m.meta_id)+'">'+esc(m.meta_id)+' — '+esc(m.alias||'')+(m.saved?' (saved)':'')+'</option>').join('');metaList.innerHTML=currentMetas.length?currentMetas.map((m,i)=>metaCard(m,i)).join(''):'<div class="small">No matching metas found in SWPDT JSON.</div>';if(currentSavedState&&currentSavedState.exec_summary){document.getElementById('execSummary').value=currentSavedState.exec_summary.join('\n');}document.getElementById('metaStatus').textContent='Matched entries: '+(d.matched_entries||0)+' | Source: '+(d.source_path||'not found')+(currentSavedState?' | Saved by '+(currentSavedState.updated_by||'-')+' at '+(currentSavedState.updated_at||'-'):'');if(currentSavedState&&currentSavedState.saved_preview){currentPreview=currentSavedState.saved_preview;renderSlide(currentPreview);}loadRevisions();}
function metaCard(m,i){const flavors=(m.product_flavors||[]).slice(0,3).map(f=>'<span class="pill">'+esc(f)+'</span>').join('');const checked=m.saved||i<5;return '<div class="meta-card"><div class="meta-row"><input type="checkbox" class="metaChk" data-idx="'+i+'" '+(checked?'checked':'')+'><div style="flex:1"><div class="meta-id">'+esc(m.meta_id)+(m.saved?' <span class="pill">SAVED</span>':'')+'</div><div class="meta-sub">Devices: '+esc(m.device_count||0)+' | Builds: '+esc(m.build_count||0)+' | Latest: '+esc((m.latest_submitted||'').slice(0,10))+'</div><div>'+flavors+'</div><input class="alias" data-alias-idx="'+i+'" value="'+esc(m.alias||m.meta_id)+'" placeholder="Alias name"></div></div></div>';}
metaDropdown.addEventListener('change',()=>{const v=metaDropdown.value;if(!v)return;document.querySelectorAll('.metaChk').forEach(ch=>{const m=currentMetas[Number(ch.dataset.idx)];ch.checked=(m&&m.meta_id===v);});});
function collectPayload(){const target=targetSelect.value;if(!target){alert('Select target');return null;}const selected=[];document.querySelectorAll('.metaChk').forEach(ch=>{if(!ch.checked)return;const i=Number(ch.dataset.idx);const m=currentMetas[i];if(!m)return;const alias=document.querySelector('[data-alias-idx="'+i+'"]');selected.push(Object.assign({},m,{alias:alias?alias.value:(m.alias||'')}));});const bullets=document.getElementById('execSummary').value.split('\n').map(x=>x.trim()).filter(Boolean);return {target:target,selected_metas:selected,exec_summary:bullets};}
async function buildPreview(){const payload=collectPayload();if(!payload)return;const r=await fetch('/api/core_deck/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!d.ok){alert(d.error||'Preview failed');return;}currentPreview=d;renderSlide(d);}
async function saveCurrent(){const payload=collectPayload();if(!payload)return;document.getElementById('saveStatus').textContent='Saving JSON...';const r=await fetch('/api/core_deck/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!d.ok){alert(d.error||'Save failed');document.getElementById('saveStatus').textContent=d.error||'Save failed';return;}currentSavedState=d.state;currentPreview=d.state.saved_preview;renderSlide(currentPreview);document.getElementById('saveStatus').textContent='Saved by '+(d.state.updated_by||'-')+' at '+(d.state.updated_at||'-')+' | '+(d.state_path||'');loadRevisions();}
async function refreshCrashes(){const target=targetSelect.value;if(!target){alert('Select target');return;}if(!confirm('Refresh crashes only from target DB and keep saved meta/alias/flavor?'))return;document.getElementById('saveStatus').textContent='Refreshing crashes only...';const r=await fetch('/api/core_deck/refresh_crashes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:target})});const d=await r.json();if(!d.ok){alert(d.error||'Refresh failed');document.getElementById('saveStatus').textContent=d.error||'Refresh failed';return;}currentSavedState=d.state;currentPreview=d.state.saved_preview;renderSlide(currentPreview);document.getElementById('saveStatus').textContent='Crashes refreshed by '+(d.state.updated_by||'-')+' at '+(d.state.updated_at||'-');loadRevisions();}
async function loadRevisions(){const target=targetSelect.value;const sel=document.getElementById('revisionSelect');if(!target||!sel)return;const r=await fetch('/api/core_deck/revisions?target='+encodeURIComponent(target));const d=await r.json();const revs=(d.ok&&d.revisions)||[];sel.innerHTML=revs.length?'<option value="">Select revision</option>'+revs.slice().reverse().map(x=>'<option value="'+esc(x.revision_id)+'">'+esc(x.updated_at)+' — '+esc(x.updated_by)+' — '+esc(x.action)+'</option>').join(''):'<option value="">No revisions</option>';}
async function revertRevision(){const target=targetSelect.value;const rev=document.getElementById('revisionSelect').value;if(!target||!rev){alert('Select revision');return;}if(!confirm('Revert Core Deck JSON to selected revision? Current state will be saved as a revision first.'))return;const r=await fetch('/api/core_deck/revert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:target,revision_id:rev})});const d=await r.json();if(!d.ok){alert(d.error||'Revert failed');return;}currentSavedState=d.state;currentPreview=d.state.saved_preview;renderSlide(currentPreview);document.getElementById('saveStatus').textContent='Reverted by '+(d.state.updated_by||'-')+' at '+(d.state.updated_at||'-');loadMetas();}
function renderSlide(d){const ti=d.target_info||{}, counts=d.summary_counts||{}, metas=d.selected_metas||[], top=d.top_hitters||[], subs=d.subsystem_chart||[], areas=d.cr_area_chart||[];const timelines=ti.timelines||{};document.getElementById('preview').innerHTML='<div class="slide-head"><div class="slide-title">PDT '+esc(ti.display_name||d.target)+' Core Deck</div><div class="qmark">T</div></div><div class="slide-body"><div class="small"><b>Target:</b> '+esc(d.target)+' &nbsp; <b>SP:</b> '+esc(ti.sp_name||'-')+' &nbsp; <b>Chip:</b> '+esc(ti.chip_name||'-')+' &nbsp; <b>Generated:</b> '+esc(d.generated_at)+'</div><div class="cards"><div class="card"><div class="n">'+esc(counts.total_jiras||0)+'</div><div class="l">Total JIRAs</div></div><div class="card"><div class="n">'+esc(counts.open_jiras||0)+'</div><div class="l">Open JIRAs</div></div><div class="card"><div class="n">'+esc(counts.unique_crs||0)+'</div><div class="l">Unique CRs</div></div><div class="card"><div class="n">'+esc(timelines.CS||timelines.FC||'-')+'</div><div class="l">CS / FC Target</div></div></div><div class="slide-grid"><div>'+execHtml(d.exec_summary)+'<div class="section-title">Selected Meta Details</div>'+metaTable(metas)+'<div class="section-title">Top Hitter CRs</div>'+topTable(top)+'</div><div><div class="section-title">CR Subsystem Chart</div><div class="chart-wrap"><canvas id="subChart"></canvas></div><div class="section-title">CR Area Chart</div><div class="chart-wrap"><canvas id="areaChart"></canvas></div></div></div></div>';drawBar('subChart',subs);drawBar('areaChart',areas);}
function execHtml(rows){if(!rows||!rows.length)return '<div class="section-title">Exec Summary</div><div class="exec small">No manual bullets entered.</div>';return '<div class="section-title">Exec Summary</div><div class="exec"><ul>'+rows.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';}
function metaTable(rows){return '<table class="data-table"><thead><tr><th>Meta</th><th>Alias</th><th>Flavor</th><th>Devices</th><th>Crashes</th><th>MTBF</th></tr></thead><tbody>'+((rows||[]).map(r=>'<tr><td>'+esc(r.meta_id)+'</td><td>'+esc(r.alias)+'</td><td>'+esc((r.product_flavors||[]).join(', '))+'</td><td>'+esc(r.device_count||0)+'</td><td>'+esc(r.crashes||0)+'</td><td>'+esc(r.mtbf||'')+'</td></tr>').join('')||'<tr><td colspan="6">No metas selected.</td></tr>')+'</tbody></table>';}
function topTable(rows){return '<table class="data-table"><thead><tr><th>CR</th><th>Title</th><th>Area</th><th>Subsystem</th><th>Status</th><th>Count</th></tr></thead><tbody>'+((rows||[]).slice(0,8).map(r=>'<tr><td>'+esc(r.cr)+'</td><td>'+esc(r.cr_title)+'</td><td>'+esc(r.cr_area)+'</td><td>'+esc(r.cr_subsystem)+'</td><td>'+esc(r.cr_status)+'</td><td>'+esc(r.jira_count)+'</td></tr>').join('')||'<tr><td colspan="6">No top hitter data.</td></tr>')+'</tbody></table>';}
function drawBar(id,rows){const ctx=document.getElementById(id);if(!ctx)return;new Chart(ctx,{type:'bar',data:{labels:(rows||[]).slice(0,10).map(r=>r.name),datasets:[{label:'CRs',data:(rows||[]).slice(0,10).map(r=>r.y),backgroundColor:'#ef1747'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}}},y:{beginAtZero:true}}}});}
(function initPreselectedTarget(){
  if(!PRESELECTED_TARGET)return;
  const row=TARGET_OPTIONS.find(r=>String(r.target||'').toLowerCase()===String(PRESELECTED_TARGET).toLowerCase());
  if(!row)return;
  buSelect.value=String(row.bu_key||'').toUpperCase();
  buildTargets();
  targetSelect.value=row.target;
  loadMetas();
})();
</script>
</body>
</html>
