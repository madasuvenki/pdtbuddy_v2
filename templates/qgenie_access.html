<div id="qgenieConfigOverlay" class="qgenie-overlay"
     data-needs-popup="{{ 'true' if session.get('needs_qgenie_popup') else 'false' }}"
     style="display:{{ 'flex' if session.get('needs_qgenie_popup') else 'none' }};position:fixed;inset:0;z-index:99999;background:rgba(7,22,51,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:center;justify-content:center;">

    <div id="qgenieConfigPanel" class="qgenie-panel"
         style="position:relative;width:min(460px,94vw);max-height:90vh;overflow-y:auto;border-radius:20px;box-shadow:0 32px 80px rgba(7,22,51,0.6);border:1.5px solid rgba(99,102,241,0.35);animation:qgeniePopIn 0.22s cubic-bezier(.34,1.56,.64,1);">

        <!-- close btn hidden in login-popup mode, shown otherwise -->
        <button id="qgenieCloseBtn" class="qgenie-close-btn" title="Close">
            <i class="fas fa-times"></i>
        </button>

        <div class="qgenie-panel-header">
            <div id="qgenieLoginBadge" style="display:none;margin-bottom:10px;padding:6px 14px;border-radius:999px;background:linear-gradient(135deg,#4f46e5,#ec4899);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-align:center;">&#129302; One last step &mdash; QGenie API Key required</div>
            <h2><i class="fas fa-cog"></i> Configuration</h2>
            <p>Configure QGenie access to use PDT Buddy.</p>
        </div>

        <div class="qgenie-form-group">
            <label for="qgenieApiKey">QGenie API Key</label>
            <div class="qgenie-input-wrap">
                <input
                    type="password"
                    id="qgenieApiKey"
                    placeholder="Enter your QGenie API key"
                    autocomplete="off"
                >
                <button type="button" id="toggleQGenieKey" class="qgenie-eye-btn" title="Show/Hide Key">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="qgenie-help-text">
                Create / copy your key here:
                <a href="https://qgenie-model-usage.qualcomm.com/api-keys" target="_blank" rel="noopener noreferrer">
                    Open QGenie API Keys
                </a>
            </div>
        </div>

        <div class="qgenie-remember-row">
            <label class="qgenie-checkbox-wrap">
                <input type="checkbox" id="rememberQGenieKey">
                <span>Remember on this browser</span>
            </label>
        </div>

        <div id="qgenieConfigMessage" class="qgenie-message"></div>

        <div class="qgenie-actions">
            <button id="saveQGenieConfigBtn" class="qgenie-save-btn">
                Save &amp; Continue
            </button>
        </div>

        <div style="text-align:center;margin-top:10px;">
            <a href="/logout" style="font-size:12px;color:#94a3b8;text-decoration:none;font-weight:600;">
                <i class="fas fa-sign-out-alt" style="margin-right:4px;"></i>Logout &amp; try different account
            </a>
        </div>

    </div>
</div>

<style>
@keyframes qgeniePopIn {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
}
</style>
